<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login | Bryan Conway Golf</title>
<link rel="icon" href="/static/images/bc_logo_final.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0d12;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:#12161d;border:1px solid #1e2530;border-radius:8px;padding:36px 32px;width:100%;max-width:320px;text-align:center;}
  .card img{height:52px;margin-bottom:16px;}
  h1{font-size:16px;font-weight:800;margin-bottom:20px;}
  input[type=password]{
    width:100%;padding:11px 12px;border:1px solid #2a323f;border-radius:4px;background:#0a0d12;color:#fff;font-size:14px;margin-bottom:14px;
  }
  button{
    width:100%;padding:11px;border:none;border-radius:4px;background:#3f6fb0;color:#fff;
    font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;
  }
  button:hover{background:#1b3a63;}
  .error{color:#e07a76;font-size:12.5px;margin-bottom:14px;}
</style>
</head>
<body>
  <div class="card">
    <img src="/static/images/bc_logo_final.png" alt="">
    <h1>Admin Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="password" name="password" placeholder="Password" autofocus required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
